  <rect x="350" y="234" width="128" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="414" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Windows x64</text>
  <rect x="490" y="234" width="160" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="570" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">one-click publish</text>
