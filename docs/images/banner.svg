  <circle cx="1120" cy="40" r="320" fill="url(#glow1)"/>
  <circle cx="120" cy="300" r="260" fill="url(#glow2)"/>
  <rect width="1280" height="4" fill="url(#accent)"/>
  <rect y="316" width="1280" height="4" fill="url(#accent)"/>

  <circle cx="152" cy="160" r="66" fill="none" stroke="url(#accentV)" stroke-width="3"/>
  <path d="M152 124 V182" stroke="url(#accentV)" stroke-width="9" stroke-linecap="round"/>
  <path d="M126 158 L152 184 L178 158" fill="none" stroke="url(#accentV)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 202 H182" stroke="url(#accentV)" stroke-width="7" stroke-linecap="round"/>

  <text x="272" y="150" font-family="Segoe UI, Segoe UI Variable, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">HRX <tspan fill="url(#accent)">Updater</tspan></text>
  <text x="274" y="204" font-family="Segoe UI, Segoe UI Variable, Arial, sans-serif" font-size="25" fill="#94a3b8">CS2 auto-update + live telemetry hub &#8212; releases, source and admin panel in one repo</text>

  <rect x="274" y="234" width="64" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
